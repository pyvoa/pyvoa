name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday 05:17 UTC: the only job that talks to upstream data providers.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ruff only: no need to build geopandas & friends just to lint.
      # The version is pinned here and in the dev extra so that a new ruff
      # release cannot turn a green branch red on its own.
      - name: Install ruff
        run: python -m pip install --disable-pip-version-check ruff==0.16.1

      - name: Run ruff
        run: ruff check --output-format=github .

  test:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pyvoa and its test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # tests/conftest.py forbids socket creation for anything not marked
      # `network`, and pyproject deselects that marker, so this job is offline.
      - name: Run the offline test suite
        run: pytest -q --cov=pyvoa --cov-report=xml --cov-report=term-missing

      - name: Publish coverage to the job summary
        if: always()
        run: |
          {
            echo "## Coverage (python ${{ matrix.python-version }})"
            echo
            python -m coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

  minimum:
    name: pytest (oldest allowed dependencies)
    # The `test` job always resolves to the newest release of everything, so on
    # its own it proves nothing about the lower bounds declared in pyproject.
    # This one pins every direct dependency to its floor, so a bound that is not
    # actually supported fails here instead of in a user's install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The floors are what an installation on the oldest supported python
          # resolves to, so this job runs there.
          python-version: '3.10'

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      # --resolution lowest-direct: floors for our own dependencies, newest for
      # everything they drag in, which is what a user pinning nothing would get
      # on an old environment.
      - name: Install pyvoa at its declared floors
        run: uv pip install --system --resolution lowest-direct -e ".[dev]"

      - name: Show what was resolved
        run: uv pip list --system

      - name: Run the offline test suite
        run: pytest -q

  network:
    name: pytest -m network
    # Upstream outages must never block a pull request, so the tests that
    # genuinely download data run on the weekly schedule and on demand only.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pyvoa and its test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the tests that hit upstream servers
        run: pytest -q -m network
