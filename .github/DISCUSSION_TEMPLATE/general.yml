# Form of the General category of GitHub Discussions.
body:
  - type: textarea
    id: message
    attributes:
      label: Message
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: pyvoa version
      description: >-
        If your message is about pyvoa's behaviour, the output of
        `pf.getversion()`, after `import pyvoa.front as pf`. Optional.
      placeholder: "v0.5.0-484-g512aefe"
    validations:
      required: false
