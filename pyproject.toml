[build-system]
# `wheel` is not listed: setuptools declares it itself, and PyPA advises against
# repeating it. The floor is what `[tool.setuptools.dynamic]` below needs to
# read the version out of pyvoa/__version__.py without importing the package.
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvoa"
dynamic = ["version"]
description = "Python virus open analysis. See more on pyvoa.org"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# The people, in the order and spelling of AUTHORS and CITATION.cff, so that
# importlib.metadata.metadata("pyvoa")["Author"] agrees with pyvoa.__author__.
# The maintainer stays the project address, which is the stable contact point
# and matches the `contact:` block of CITATION.cff.
authors = [
    { name = "Tristan Beau", email = "tristan.beau@u-pariscite.fr" },
    { name = "Julien Browaeys", email = "julien.browaeys@u-pariscite.fr" },
    { name = "Olivier Dadoun", email = "dadoun@in2p3.fr" },
]
maintainers = [
    { name = "pyvoa.org", email = "contact@pyvoa.org" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Lower bounds only, and each one is tested: the `minimum` CI job resolves this
# list to its floors and runs the suite against them, so a floor that is not
# true fails there. There are deliberately no upper bounds — capping a library's
# dependencies propagates into every environment that installs it and is the
# usual cause of unresolvable installs. A new upstream major is caught by CI,
# which always resolves to the newest release, not by a cap here.
dependencies = [
    "pandas>=2.1.1",
    "geopandas>=1.0",
    "shapely>=2.0.2",
    "beautifulsoup4>=4.11",
    "numpy>=1.26",
    "pycountry>=22.3.5",
    "pycountry_convert>=0.7.2",
    "requests>=2.28",
    "unidecode>=1.3",
    "lxml>=4.9.3",
    "IPython>=8.10",
    "contextily>=1.3",
    "html5lib>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff==0.16.1",
    # tests/test_paper.py reads pyproject.toml to check the manuscript against
    # the declared python floor and dependency list. 3.11 has tomllib in the
    # standard library; on 3.10 the tests would silently skip without this.
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://pyvoa.org"
Repository = "https://github.com/pyvoa/pyvoa"

[tool.setuptools.dynamic]
version = { attr = "pyvoa.__version__.__version__" }

[tool.setuptools.packages.find]
include = ["pyvoa*"]

[tool.setuptools.package-data]
pyvoa = ["data/*.json", "data/*.png"]

[tool.ruff]
target-version = "py310"
# The example notebooks are documentation, not library code: they are meant to
# read like a user's session and are not held to the package's lint standard.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# ruff's default rule set, plus the pycodestyle error rules it leaves out
# (E4 imports, E7 statements, E9 runtime). The ruff version is pinned in the
# dev extra so that the gate is reproducible: a new ruff may widen its default
# selection, and the CI lint job must not start failing on its own.
# "D" is pydocstyle: docstrings are held to the NumPy convention, configured
# under [tool.ruff.lint.pydocstyle] below. The package is at zero D findings,
# so a new docstring that drifts from the convention fails CI rather than
# landing and being tidied up later.
extend-select = ["E4", "E7", "E9", "D"]

# Every other finding reported by this selection has been fixed. The three rules
# below are switched off deliberately, because applying them would change
# behaviour rather than clean it up:
ignore = [
    # pyvoa funnels third-party failures into PyvoaError, its single documented
    # exception type, so `except Exception` followed by `raise PyvoaError(...)`
    # is the intended pattern and not a blind catch.
    "BLE001",
    # Epidemiological series are indexed by calendar dates, which have no
    # timezone: the reporting day of a case count is a date, not an instant.
    # Making these datetimes tz-aware would shift dates near midnight.
    "DTZ001", "DTZ007", "DTZ011",
]

[tool.ruff.lint.pydocstyle]
# NumPy docstring convention: a one-line summary in the imperative mood, a
# blank line, then the prose and the underlined sections (Parameters, Returns,
# Raises, ...). Setting `convention` also switches off the D rules that
# contradict it, so this line is what makes the selection above coherent
# rather than self-conflicting. See
# https://numpydoc.readthedocs.io/en/latest/format.html
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# The example scripts are documentation, not library code, exactly like the
# notebooks excluded above: they are meant to read as a user's session.
"examples/*" = ["D"]

# A test documents itself through its name and its assertions, so a missing
# docstring is not a finding here. The ones that do carry a docstring are
# still held to the NumPy convention, like the rest of the tree.
"tests/*" = ["D100", "D101", "D102", "D103", "D104"]

# front.py sets a FutureWarning filter before importing pandas/geopandas so that
# warnings raised *during* those imports stay hidden from notebook users, and it
# exposes the singleton's methods at module level after instantiating it. Both
# require statements between the imports.
"pyvoa/front.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: test needs internet access; deselected by default, run with -m network",
]
