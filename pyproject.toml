[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvoa"
dynamic = ["version"]
description = "Python virus open analysis. See more on pyvoa.org"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "pyvoa.org", email = "contact@pyvoa.org" },
]
maintainers = [
    { name = "pyvoa.org", email = "contact@pyvoa.org" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Lower bounds only, and each one is tested: the `minimum` CI job resolves this
# list to its floors and runs the suite against them, so a floor that is not
# true fails there. There are deliberately no upper bounds — capping a library's
# dependencies propagates into every environment that installs it and is the
# usual cause of unresolvable installs. A new upstream major is caught by CI,
# which always resolves to the newest release, not by a cap here.
dependencies = [
    "pandas>=2.1.1",
    "geopandas>=1.0",
    "shapely>=2.0.2",
    "beautifulsoup4>=4.11",
    "numpy>=1.26",
    "pycountry>=22.3.5",
    "pycountry_convert>=0.7.2",
    "requests>=2.28",
    "unidecode>=1.3",
    "lxml>=4.9.3",
    "IPython>=8.10",
    "contextily>=1.3",
    "html5lib>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff==0.16.1",
    # tests/test_paper.py reads pyproject.toml to check the manuscript against
    # the declared python floor and dependency list. 3.11 has tomllib in the
    # standard library; on 3.10 the tests would silently skip without this.
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://pyvoa.org"
Repository = "https://github.com/pyvoa/pyvoa"

[tool.setuptools.dynamic]
version = { attr = "pyvoa.__version__.__version__" }

[tool.setuptools.packages.find]
include = ["pyvoa*"]

[tool.setuptools.package-data]
pyvoa = ["data/*.json", "data/*.png"]

[tool.ruff]
target-version = "py310"
# The example notebooks are documentation, not library code: they are meant to
# read like a user's session and are not held to the package's lint standard.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# ruff's default rule set, plus the pycodestyle error rules it leaves out
# (E4 imports, E7 statements, E9 runtime). The ruff version is pinned in the
# dev extra so that the gate is reproducible: a new ruff may widen its default
# selection, and the CI lint job must not start failing on its own.
extend-select = ["E4", "E7", "E9"]

# Every other finding reported by this selection has been fixed. The three rules
# below are switched off deliberately, because applying them would change
# behaviour rather than clean it up:
ignore = [
    # pyvoa funnels third-party failures into PyvoaError, its single documented
    # exception type, so `except Exception` followed by `raise PyvoaError(...)`
    # is the intended pattern and not a blind catch.
    "BLE001",
    # Epidemiological series are indexed by calendar dates, which have no
    # timezone: the reporting day of a case count is a date, not an instant.
    # Making these datetimes tz-aware would shift dates near midnight.
    "DTZ001", "DTZ007", "DTZ011",
]

[tool.ruff.lint.per-file-ignores]
# front.py sets a FutureWarning filter before importing pandas/geopandas so that
# warnings raised *during* those imports stay hidden from notebook users, and it
# exposes the singleton's methods at module level after instantiating it. Both
# require statements between the imports.
"pyvoa/front.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: test needs internet access; deselected by default, run with -m network",
]
